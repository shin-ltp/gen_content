# SearXNG settings.yml — us-stock-daily 专用配置（本机实例）
# 由 ../docker-compose.yaml 挂载到 /etc/searxng/settings.yml。
# 设计原则: 本机专用实例（端口仅绑 127.0.0.1，无外部访问、无认证层），
#           关闭限流、开启 JSON API、引擎白名单聚焦财经新闻与日文源。

use_default_settings:
  engines:
    # 只保留项目需要的引擎（白名单）。每多一个引擎 = 每次查询多一次上游请求，
    # 聚焦白名单可降低被上游封锁的概率、提高响应速度。
    # ⚠ 实测（2026-08-05，GCP 数据中心 IP）: google/google news 静默返回空、
    # 视情况加回 google 系（测试方法见 README「引擎可用性重测」）。
    # ✅ 重测（2026-08-06，本机家庭 IP，q="stock market"）:
    #   可用: google(10) / bing(10) / bing news(10) / duckduckgo(10) / duckduckgo news(26)，
    #         且 google・bing・duckduckgo・duckduckgo news 均支持 language=ja-JP 日文检索。
    #   不可用: google news(空) / brave・qwant・yahoo・yahoo news(无响应) / mojeek(空)。
    #   → 白名单收敛为以下 5 个。日文源用请求级 language=ja-JP（yahoo 不可用的替代方案）。
    # ✅ 图片引擎（2026-08-07 追加）: 供其他项目共用图片检索。
    #   SearXNG 按 category 路由，图片引擎只在 categories=images 时触发，
    #   不影响本项目 categories=general/news 的查询性能。
    #   google images 已测（2026-08-07）: 可用，英文/日文查询均正常。
    keep_only:
      - google
      - bing
      - bing news
      - duckduckgo
      - duckduckgo news
      - bing images
      - duckduckgo images
      - google images

general:
  debug: false
  instance_name: "us-stock-daily searxng"
  enable_metrics: true        # /stats 页可查看各引擎成功率，便于调整白名单

search:
  safe_search: 0
  autocomplete: ""
  default_lang: auto          # 具体语言由调用方按请求指定（en-US / ja-JP）
  formats:                    # ★ JSON API 是 agent 调用的前提，务必保留 json
    - html
    - json
  ban_time_on_fail: 5         # 上游引擎失败时的临时封禁（秒），防止坏引擎拖慢查询
  max_ban_time_on_fail: 120

server:
  port: 8080
  bind_address: "0.0.0.0"     # 容器内绑定；compose 侧只映射到 127.0.0.1，本机以外不可达
  secret_key: "8fbfa00823c60323955e9f726b923786c379942429be7e04edb38d9ae5be8fca"
  limiter: false              # 本机专用，关闭限流（无需 redis/valkey）
  public_instance: false
  image_proxy: false
  method: "GET"

outgoing:
  request_timeout: 8.0        # 财经新闻源偶尔较慢，放宽默认超时
  max_request_timeout: 15.0
  pool_connections: 100
  pool_maxsize: 20

engines:
  # 当前白名单只有 bing 系（见上方实测记录）。bing news 结果常为 msn.com 镜像页，
  # 原文媒体名在 metadata 字段（如 "14 hours ago | The Motley Fool"），落素材时一并记录。
  - name: bing
    weight: 1.0
  - name: bing news
    weight: 1.2               # 新闻类主力（NWS / ERN 素材）
  # ── 图片引擎（供其他项目共用，不影响本项目新闻/文章检索） ──
  - name: bing images
    weight: 1.0
  - name: duckduckgo images
    weight: 1.0
  - name: google images
    weight: 1.0
