<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Episodes Plan Editor</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f0f2f5;--card:#fff;--border:#dde1e6;--text:#1d1d1f;--text2:#6e6e73;
  --accent:#0071e3;--accent-light:#e8f0fe;--danger:#ff3b30;--success:#34c759;
  --shadow:0 1px 3px rgba(0,0,0,.08);
  --radius:8px;--col-gap:12px;
}
html{font-size:14px}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow:hidden}

/* ── Header ── */
header{background:#fff;border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;gap:16px;flex-shrink:0;position:relative;z-index:100}
header h1{font-size:1.1rem;font-weight:700;white-space:nowrap}
.summary-bar{display:flex;gap:16px;font-size:.8rem;color:var(--text2);white-space:nowrap;align-items:center;flex:1}
.summary-bar .stat{background:var(--bg);padding:3px 10px;border-radius:12px;font-weight:600}
.btn{padding:6px 16px;border:none;border-radius:var(--radius);font-size:.85rem;font-weight:600;cursor:pointer;transition:all .15s}
.btn:disabled{opacity:.4;cursor:default}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover:not(:disabled){background:#005bb5}
.btn-confirm{background:var(--success);color:#fff}
.btn-confirm:hover:not(:disabled){background:#248a3d}
.btn-ghost{background:transparent;color:var(--text2);padding:4px 8px}
.btn-ghost:hover{background:var(--bg);color:var(--text)}
.btn-danger{background:var(--danger);color:#fff;padding:4px 10px;font-size:.75rem}
.btn-danger:hover{background:#e6352b}
.episode-header .ep-header-actions{display:flex;align-items:center;gap:6px;margin-left:auto}
.episode-header .ep-title-row{display:flex;align-items:center;justify-content:space-between;width:100%;margin-bottom:6px;gap:8px}
.header-btns{display:flex;gap:8px;flex-shrink:0}
.status-msg{font-size:.8rem;color:var(--success);font-weight:600;margin-right:4px;display:none}

/* ── Board ── */
#board{display:flex;gap:var(--col-gap);padding:12px 16px;overflow-x:auto;overflow-y:hidden;flex:1;align-items:flex-start}
#board:empty::after{content:"読み込み中...";display:block;width:100%;text-align:center;color:var(--text2);margin-top:120px;font-size:1rem}

/* ── Episode Column ── */
.episode-col{min-width:320px;max-width:360px;width:320px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);display:flex;flex-direction:column;max-height:calc(100vh - 72px);flex-shrink:0}
.episode-header{padding:12px 14px 10px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--card);border-radius:var(--radius) var(--radius) 0 0;z-index:2}
.episode-header .ep-title{font-size:1rem;font-weight:700;display:flex;align-items:center;gap:8px}
.episode-header .ep-title .ep-num{background:var(--accent);color:#fff;border-radius:50%;width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;font-size:.8rem;flex-shrink:0}
.ep-stats{display:flex;gap:8px;flex-wrap:wrap;font-size:.75rem;color:var(--text2)}
.ep-stats span{background:var(--bg);padding:2px 8px;border-radius:10px}
.ep-sections{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.section-badge{font-size:.65rem;padding:2px 7px;border-radius:10px;font-weight:600;white-space:nowrap}

.article-list{padding:6px;overflow-y:auto;flex:1;min-height:60px}
.article-list.drag-over{background:var(--accent-light)}

/* ── Article Card ── */
.article-card{background:#fff;border:1px solid var(--border);border-radius:6px;padding:10px 12px;margin-bottom:6px;cursor:grab;transition:box-shadow .15s,opacity .15s,transform .15s;position:relative;border-left:4px solid #888;z-index:1}
.article-card:hover{box-shadow:0 2px 8px rgba(0,0,0,.1);z-index:10}
.article-card.dragging{opacity:.35;transform:scale(.97)}
.article-card .card-header{display:flex;justify-content:space-between;align-items:flex-start;gap:4px;margin-bottom:4px}
.article-card .thumb-wrapper{position:relative;flex-shrink:0}
.article-card .card-thumb{width:45px;height:60px;object-fit:cover;border-radius:4px;border:1px solid var(--border);display:block;background:var(--bg)}
.article-card .thumb-large{display:none;position:absolute;top:-10px;left:55px;width:180px;height:240px;object-fit:cover;border-radius:6px;border:1px solid var(--border);box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:100;pointer-events:none}
.article-card .thumb-wrapper:hover .thumb-large{display:block}
.article-card .card-title{font-size:.85rem;font-weight:600;line-height:1.35;flex:1;margin-left:4px}
.article-card .card-actions{display:flex;gap:2px;align-items:center;flex-shrink:0}
.article-card .card-id{font-size:.7rem;color:var(--text2);background:var(--bg);padding:1px 6px;border-radius:8px;white-space:nowrap}
.article-card .move-btn{width:24px;height:24px;border:1px solid var(--border);border-radius:4px;background:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:.75rem;color:var(--text2);transition:all .15s;padding:0}
.article-card .move-btn:hover{background:var(--accent-light);border-color:var(--accent);color:var(--accent)}
.article-card .move-btn svg{width:14px;height:14px}
.article-card .card-section{font-size:.7rem;color:var(--text2);margin-bottom:4px}
.article-card .card-summary{font-size:.75rem;color:var(--text2);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:6px}
.article-card .card-footer{display:flex;justify-content:space-between;align-items:center;gap:4px}
.article-card .card-keywords{display:flex;gap:3px;flex-wrap:wrap;flex:1}
.article-card .kw-tag{font-size:.6rem;background:var(--bg);padding:1px 6px;border-radius:8px;color:var(--text2);white-space:nowrap;max-width:90px;overflow:hidden;text-overflow:ellipsis}
.article-card .card-meta{font-size:.7rem;color:var(--text2);white-space:nowrap;flex-shrink:0}

/* ── Drop indicator ── */
.drop-indicator{height:3px;background:var(--accent);border-radius:2px;margin:2px 0;transition:all .1s;pointer-events:none}

/* ── Modal ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1000;display:none;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,.2);width:480px;max-width:90vw;max-height:85vh;display:flex;flex-direction:column;animation:modalIn .15s ease}
@keyframes modalIn{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:translateY(0)}}
.modal-header{padding:16px 20px 12px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-header h3{font-size:.95rem;font-weight:700}
.modal-close{background:none;border:none;font-size:1.3rem;cursor:pointer;color:var(--text2);padding:0 4px;line-height:1}
.modal-close:hover{color:var(--text)}
.modal-body{padding:16px 20px;overflow-y:auto;flex:1}
.modal-article-info{background:var(--bg);border-radius:var(--radius);padding:10px 14px;margin-bottom:16px}
.modal-article-info .mai-title{font-weight:600;font-size:.85rem;margin-bottom:2px}
.modal-article-info .mai-sub{font-size:.75rem;color:var(--text2)}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:.8rem;font-weight:600;margin-bottom:6px;color:var(--text2)}
.form-group select{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius);font-size:.85rem;background:#fff;color:var(--text);cursor:pointer;appearance:auto}
.form-group select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,113,227,.12)}
.pos-preview{margin-top:8px;border:1px solid var(--border);border-radius:var(--radius);max-height:200px;overflow-y:auto}
.pos-item{padding:6px 12px;font-size:.78rem;display:flex;align-items:center;gap:8px;border-bottom:1px solid #f0f0f0;color:var(--text2)}
.pos-item:last-child{border-bottom:none}
.pos-item .pos-num{font-weight:700;color:var(--accent);min-width:20px}
.pos-item.pos-insert{background:var(--accent-light);color:var(--accent);font-weight:600}
.pos-item.pos-current{background:#fff8e1;color:#f57f17}
.modal-footer{padding:12px 20px 16px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
.btn-cancel{background:var(--bg);color:var(--text)}
.btn-cancel:hover{background:#e0e0e0}

/* ── Scrollbar ── */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#c1c1c1;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#999}

/* ── Layout ── */
#app{display:flex;flex-direction:column;height:100vh}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Episodes Editor</h1>
    <div id="summaryBar" class="summary-bar"></div>
    <span id="statusMsg" class="status-msg"></span>
    <div class="header-btns">
      <button id="addChapterBtn" class="btn btn-ghost" title="新しい章を追加">＋ 新章追加</button>
      <button id="saveBtn" class="btn btn-primary">保存</button>
      <button id="confirmBtn" class="btn btn-confirm">確認</button>
    </div>
  </header>
  <div id="board"></div>
</div>

<!-- Move Modal -->
<div id="moveModal" class="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <h3>記事を移動</h3>
      <button class="modal-close" id="modalCloseBtn">&times;</button>
    </div>
    <div class="modal-body">
      <div class="modal-article-info" id="modalArticleInfo"></div>
      <div class="form-group">
        <label>移動先エピソード</label>
        <select id="moveEpSelect"></select>
      </div>
      <div class="form-group">
        <label>挿入位置</label>
        <select id="movePosSelect"></select>
        <div class="pos-preview" id="posPreview"></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-cancel" id="modalCancelBtn">キャンセル</button>
      <button class="btn btn-primary" id="modalMoveBtn">移動</button>
    </div>
  </div>
</div>

<!-- Image Modal -->
<div id="imageModal" class="modal-overlay">
  <div class="modal" style="width: auto; max-width: 90vw; display: flex; flex-direction: column; align-items: center;">
    <div class="modal-header" style="width: 100%;">
      <h3 id="imageModalTitle">画像確認</h3>
      <button class="modal-close" id="imageModalCloseBtn">&times;</button>
    </div>
    <div class="modal-body" style="text-align: center; padding: 20px;">
      <img id="imageModalImg" src="" style="max-width: 100%; max-height: 60vh; border-radius: 8px; border: 1px solid var(--border);" />
      <div style="margin-top: 15px; display: flex; align-items: center; justify-content: center;">
        <button class="btn btn-primary" id="imageModalRegenBtn">画像を再生成 (Regenerate)</button>
        <span id="imageModalStatus" style="margin-left: 12px; font-size: 0.9rem; font-weight: 600;"></span>
      </div>
    </div>
  </div>
</div>

<script>
const CHARS_PER_MINUTE = 350;
const SECTION_COLORS = {};
const COLOR_PALETTE = [
  '#0071e3','#34c759','#ff9500','#af52de','#ff3b30','#5ac8fa',
  '#ff2d55','#ffcc00','#64d2ff','#30b0c7','#ac8e68','#8e8e93',
  '#007aff','#28cd41','#ff6482','#bf5af2','#a2845e','#5856d6',
];
let colorIdx = 0;

let planData = null;
let isDirty = false;

// Modal state
let modalSrcEpIdx = -1;
let modalSrcArtIdx = -1;

/* ── Section color helper ── */
function sectionColor(name) {
  if (!SECTION_COLORS[name]) {
    SECTION_COLORS[name] = COLOR_PALETTE[colorIdx % COLOR_PALETTE.length];
    colorIdx++;
  }
  return SECTION_COLORS[name];
}

function hexToRgba(hex, a) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

async function readJsonBody(resp) {
  const text = await resp.text();
  try {
    return JSON.parse(text);
  } catch {
    return { error: text.trim() || `HTTP ${resp.status}` };
  }
}

/* ── Auto-load from API ── */
async function autoLoad() {
  try {
    const resp = await fetch('/api/episodes-plan');
    const data = await readJsonBody(resp);
    if (!resp.ok) {
      const hint = resp.status === 404
        ? '（初回はオーケストレーターで分組計算後に draft が渡るまでお待ちください）'
        : '';
      throw new Error((data.error || `HTTP ${resp.status}`) + hint);
    }
    planData = data;
    if (!planData.episodes || !Array.isArray(planData.episodes)) throw new Error('episodes が見つかりません');
    isDirty = false;
    render();
  } catch (e) {
    document.getElementById('board').innerHTML =
      `<div style="text-align:center;color:#ff3b30;margin:80px auto;font-size:1rem;max-width:520px;padding:0 16px">
         プランの読み込みに失敗しました: ${escapeHtml(e.message)}
       </div>`;
  }
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

/* ── Save via API ── */
const saveBtn = document.getElementById('saveBtn');
const confirmBtn = document.getElementById('confirmBtn');
const addChapterBtn = document.getElementById('addChapterBtn');

addChapterBtn.addEventListener('click', () => {
  if (!planData) return;
  const maxNum = planData.episodes.reduce((m, ep) => Math.max(m, ep.episode_num || 0), 0);
  planData.episodes.push({
    episode_num: maxNum + 1,
    articles: [],
  });
  isDirty = true;
  render();
});

saveBtn.addEventListener('click', async () => {
  if (!planData) return;
  recalcPlan();
  saveBtn.disabled = true;
  saveBtn.textContent = '保存中...';
  try {
    const resp = await fetch('/api/episodes-plan', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(planData),
    });
    const data = await readJsonBody(resp);
    if (!resp.ok) {
      const msg = data.error || `HTTP ${resp.status}`;
      alert('保存に失敗しました:\n\n' + msg);
      return;
    }
    isDirty = false;
    showStatus('保存しました');
  } catch (e) {
    alert('保存に失敗しました: ' + e.message);
  } finally {
    saveBtn.disabled = false;
    saveBtn.textContent = '保存';
  }
});

confirmBtn.addEventListener('click', async () => {
  if (!planData) return;
  recalcPlan();
  confirmBtn.disabled = true;
  confirmBtn.textContent = '確認中...';
  try {
    const resp = await fetch('/api/episodes-plan/confirm', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(planData),
    });
    const data = await readJsonBody(resp);
    if (!resp.ok) {
      const msg = data.error || `HTTP ${resp.status}`;
      alert('確認に失敗しました:\n\n' + msg);
      confirmBtn.disabled = false;
      confirmBtn.textContent = '確認';
      return;
    }
    isDirty = false;
    confirmBtn.textContent = '確認済み ✓';
    showStatus('確認しました。次のステップに進みます...');
  } catch (e) {
    alert('確認に失敗しました: ' + e.message);
    confirmBtn.disabled = false;
    confirmBtn.textContent = '確認';
  }
});

function showStatus(msg) {
  const el = document.getElementById('statusMsg');
  el.textContent = msg;
  el.style.display = 'inline';
  setTimeout(() => { el.style.display = 'none'; }, 3000);
}

/* ── Recalc stats ── */
function recalcEpisode(ep) {
  ep.article_count = ep.articles.length;
  let totalChars = 0;
  for (const a of ep.articles) {
    const cc = a.char_count || 0;
    a.estimated_minutes = Math.round(cc / CHARS_PER_MINUTE * 10) / 10;
    totalChars += cc;
  }
  ep.estimated_minutes = Math.round(totalChars / CHARS_PER_MINUTE * 10) / 10;
  const seen = new Set();
  ep.sections = [];
  for (const a of ep.articles) {
    if (!seen.has(a.section)) { seen.add(a.section); ep.sections.push(a.section); }
  }
}

function recalcPlan() {
  if (!planData) return;
  planData.episodes.forEach(recalcEpisode);
  planData.episode_count = planData.episodes.length;
  planData.total_articles = planData.episodes.reduce((s, ep) => s + ep.articles.length, 0);
}

/* ── Render ── */
const board = document.getElementById('board');
const summaryBar = document.getElementById('summaryBar');

function render() {
  if (!planData) return;
  recalcPlan();
  board.innerHTML = '';
  updateSummary();

  planData.episodes.forEach((ep, epIdx) => {
    const col = document.createElement('div');
    col.className = 'episode-col';
    col.dataset.epIdx = epIdx;

    const header = document.createElement('div');
    header.className = 'episode-header';
    const totalChars = ep.articles.reduce((s, a) => s + (a.char_count || 0), 0);
    const isBlank = ep.articles.length === 0;
    const deleteBtnHtml = isBlank
      ? `<button class="btn btn-danger ep-delete-btn" data-ep-idx="${epIdx}" title="この章を削除">削除</button>`
      : '';
    header.innerHTML = `
      <div class="ep-title-row">
        <div class="ep-title"><span class="ep-num">${ep.episode_num}</span>EP ${ep.episode_num}</div>
        <div class="ep-header-actions">${deleteBtnHtml}</div>
      </div>
      <div class="ep-stats">
        <span>${ep.articles.length} 篇</span>
        <span>${ep.estimated_minutes} 分</span>
        <span>${totalChars.toLocaleString()} 字</span>
      </div>
      <div class="ep-sections">${ep.sections.map(s => {
        const c = sectionColor(s);
        return `<span class="section-badge" style="background:${hexToRgba(c,.12)};color:${c}">${s}</span>`;
      }).join('')}</div>`;
    col.appendChild(header);

    if (isBlank) {
      header.querySelector('.ep-delete-btn').addEventListener('click', e => {
        e.stopPropagation();
        deleteChapter(epIdx);
      });
    }

    const list = document.createElement('div');
    list.className = 'article-list';
    list.dataset.epIdx = epIdx;

    ep.articles.forEach((art, artIdx) => {
      list.appendChild(createArticleCard(art, artIdx, epIdx));
    });

    setupDropTarget(list);
    col.appendChild(list);
    board.appendChild(col);
  });
}

const MOVE_ICON_SVG = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l4-4 4 4M4 10l4 4 4-4M8 2v12"/></svg>`;

function createArticleCard(art, artIdx, epIdx) {
  const card = document.createElement('div');
  card.className = 'article-card';
  card.draggable = true;
  card.dataset.epIdx = epIdx;
  card.dataset.artIdx = artIdx;
  card.dataset.artId = art.id;

  const c = sectionColor(art.section);
  card.style.borderLeftColor = c;

  const kwHtml = (art.keywords_ja || []).slice(0, 4).map(k =>
    `<span class="kw-tag" title="${k}">${k}</span>`
  ).join('');

  card.innerHTML = `
    <div class="card-header">
      <div class="thumb-wrapper">
        <img class="card-thumb" src="/api/image/${String(art.id).padStart(3, '0')}.png" onerror="this.style.display='none';this.nextElementSibling.style.display='none'" />
        <img class="thumb-large" src="/api/image/${String(art.id).padStart(3, '0')}.png" />
      </div>
      <div class="card-title">${art.title_ja || '(no title)'}</div>
      <div class="card-actions">
        <span class="card-id">ID:${art.id}</span>
        <button class="move-btn" title="移動">${MOVE_ICON_SVG}</button>
      </div>
    </div>
    <div class="card-section" style="color:${c}">${art.section}</div>
    <div class="card-summary" title="${(art.summary_ja||'').replace(/"/g,'&quot;')}">${art.summary_ja || ''}</div>
    <div class="card-footer">
      <div class="card-keywords">${kwHtml}</div>
      <div class="card-meta">${(art.char_count||0).toLocaleString()}字 / ${art.estimated_minutes||0}分</div>
    </div>`;

  card.querySelector('.move-btn').addEventListener('click', e => {
    e.stopPropagation();
    openMoveModal(epIdx, artIdx);
  });

  const thumbWrapper = card.querySelector('.thumb-wrapper');
  if (thumbWrapper) {
    thumbWrapper.style.cursor = 'pointer';
    thumbWrapper.addEventListener('click', e => {
      e.stopPropagation();
      openImageModal(art);
    });
  }

  card.addEventListener('dragstart', e => {
    card.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', JSON.stringify({
      epIdx: parseInt(card.dataset.epIdx),
      artIdx: parseInt(card.dataset.artIdx),
      artId: art.id,
    }));
  });
  card.addEventListener('dragend', () => {
    card.classList.remove('dragging');
    clearIndicators();
  });

  return card;
}

/* ── Drop target logic ── */
function setupDropTarget(list) {
  list.addEventListener('dragover', e => {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    list.classList.add('drag-over');
    showInsertIndicator(list, e.clientY);
  });

  list.addEventListener('dragleave', e => {
    if (!list.contains(e.relatedTarget)) {
      list.classList.remove('drag-over');
      clearIndicators(list);
    }
  });

  list.addEventListener('drop', e => {
    e.preventDefault();
    list.classList.remove('drag-over');
    clearIndicators();

    let payload;
    try { payload = JSON.parse(e.dataTransfer.getData('text/plain')); } catch { return; }

    const srcEpIdx = payload.epIdx;
    const srcArtIdx = payload.artIdx;
    const dstEpIdx = parseInt(list.dataset.epIdx);
    const dstInsertIdx = getInsertIndex(list, e.clientY);

    moveArticle(srcEpIdx, srcArtIdx, dstEpIdx, dstInsertIdx);
  });
}

function getInsertIndex(list, mouseY) {
  const cards = [...list.querySelectorAll('.article-card:not(.dragging)')];
  for (let i = 0; i < cards.length; i++) {
    const rect = cards[i].getBoundingClientRect();
    const midY = rect.top + rect.height / 2;
    if (mouseY < midY) return i;
  }
  return cards.length;
}

function showInsertIndicator(list, mouseY) {
  clearIndicators(list);
  const cards = [...list.querySelectorAll('.article-card:not(.dragging)')];
  const idx = getInsertIndex(list, mouseY);
  const indicator = document.createElement('div');
  indicator.className = 'drop-indicator';
  if (idx < cards.length) {
    list.insertBefore(indicator, cards[idx]);
  } else {
    list.appendChild(indicator);
  }
}

function clearIndicators(scope) {
  const root = scope || document;
  root.querySelectorAll('.drop-indicator').forEach(el => el.remove());
  document.querySelectorAll('.article-list.drag-over').forEach(el => el.classList.remove('drag-over'));
}

/* ── Data mutation ── */
function moveArticle(srcEpIdx, srcArtIdx, dstEpIdx, dstInsertIdx) {
  const srcEp = planData.episodes[srcEpIdx];
  const dstEp = planData.episodes[dstEpIdx];
  if (!srcEp || !dstEp) return;

  const [article] = srcEp.articles.splice(srcArtIdx, 1);
  if (!article) return;

  if (srcEpIdx === dstEpIdx && srcArtIdx < dstInsertIdx) {
    dstInsertIdx = Math.max(0, dstInsertIdx - 1);
  }

  dstEp.articles.splice(dstInsertIdx, 0, article);
  isDirty = true;
  render();
}

function deleteChapter(epIdx) {
  const ep = planData.episodes[epIdx];
  if (!ep || ep.articles.length > 0) return;
  planData.episodes.splice(epIdx, 1);
  isDirty = true;
  render();
}

/* ── Move Modal ── */
const moveModal = document.getElementById('moveModal');
const moveEpSelect = document.getElementById('moveEpSelect');
const movePosSelect = document.getElementById('movePosSelect');
const posPreview = document.getElementById('posPreview');
const modalArticleInfo = document.getElementById('modalArticleInfo');

document.getElementById('modalCloseBtn').addEventListener('click', closeMoveModal);
document.getElementById('modalCancelBtn').addEventListener('click', closeMoveModal);
document.getElementById('modalMoveBtn').addEventListener('click', execModalMove);
moveModal.addEventListener('click', e => { if (e.target === moveModal) closeMoveModal(); });

moveEpSelect.addEventListener('change', () => updatePosSelect());
movePosSelect.addEventListener('change', () => updatePosPreview());

function openMoveModal(epIdx, artIdx) {
  modalSrcEpIdx = epIdx;
  modalSrcArtIdx = artIdx;

  const art = planData.episodes[epIdx].articles[artIdx];
  const c = sectionColor(art.section);

  modalArticleInfo.innerHTML = `
    <div class="mai-title" style="border-left:3px solid ${c};padding-left:8px">${art.title_ja || '(no title)'}</div>
    <div class="mai-sub">ID:${art.id} &middot; ${art.section} &middot; ${(art.char_count||0).toLocaleString()}字 / ${art.estimated_minutes||0}分</div>
    <div class="mai-sub" style="margin-top:2px">現在: EP ${planData.episodes[epIdx].episode_num}（${artIdx + 1}番目 / ${planData.episodes[epIdx].articles.length}篇）</div>`;

  moveEpSelect.innerHTML = '';
  planData.episodes.forEach((ep, i) => {
    const opt = document.createElement('option');
    opt.value = i;
    const secs = ep.sections.join(', ');
    const isCurrent = (i === epIdx);
    opt.textContent = `EP ${ep.episode_num}（${ep.articles.length}篇, ${ep.estimated_minutes}分）${isCurrent ? ' ← 現在' : ''} [${secs}]`;
    moveEpSelect.appendChild(opt);
  });
  const otherEp = planData.episodes.findIndex((_, i) => i !== epIdx);
  moveEpSelect.value = otherEp >= 0 ? otherEp : epIdx;

  updatePosSelect();
  moveModal.classList.add('open');
}

function closeMoveModal() {
  moveModal.classList.remove('open');
  modalSrcEpIdx = -1;
  modalSrcArtIdx = -1;
}

function updatePosSelect() {
  const dstEpIdx = parseInt(moveEpSelect.value);
  const dstEp = planData.episodes[dstEpIdx];
  const isSameEp = (dstEpIdx === modalSrcEpIdx);

  movePosSelect.innerHTML = '';
  const count = isSameEp ? dstEp.articles.length - 1 : dstEp.articles.length;

  for (let i = 0; i <= count; i++) {
    const opt = document.createElement('option');
    opt.value = i;
    if (i === 0) {
      opt.textContent = `先頭（1番目）`;
    } else if (i === count) {
      opt.textContent = `末尾（${i + 1}番目）`;
    } else {
      let refArt;
      if (isSameEp) {
        const simulated = dstEp.articles.filter((_, idx) => idx !== modalSrcArtIdx);
        refArt = simulated[i - 1];
      } else {
        refArt = dstEp.articles[i - 1];
      }
      const afterTitle = refArt ? truncate(refArt.title_ja || '?', 18) : '?';
      opt.textContent = `${i + 1}番目（「${afterTitle}」の後）`;
    }
    movePosSelect.appendChild(opt);
  }
  movePosSelect.value = count;
  updatePosPreview();
}

function updatePosPreview() {
  const dstEpIdx = parseInt(moveEpSelect.value);
  const dstEp = planData.episodes[dstEpIdx];
  const insertPos = parseInt(movePosSelect.value);
  const isSameEp = (dstEpIdx === modalSrcEpIdx);
  const srcArt = planData.episodes[modalSrcEpIdx].articles[modalSrcArtIdx];

  let articles;
  if (isSameEp) {
    articles = dstEp.articles.filter((_, idx) => idx !== modalSrcArtIdx);
  } else {
    articles = [...dstEp.articles];
  }

  const simulated = [...articles];
  simulated.splice(insertPos, 0, { ...srcArt, _isInserted: true });

  posPreview.innerHTML = '';
  simulated.forEach((a, i) => {
    const div = document.createElement('div');
    const isInserted = a._isInserted;
    const isCurrent = !isInserted && isSameEp && a.id === srcArt.id;
    div.className = 'pos-item' + (isInserted ? ' pos-insert' : '') + (isCurrent ? ' pos-current' : '');
    const c = sectionColor(a.section);
    div.innerHTML = `<span class="pos-num">${i + 1}</span>
      <span style="color:${c};font-size:.7rem">${a.section}</span>
      <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${isInserted ? '→ ' : ''}${truncate(a.title_ja || '?', 28)}</span>
      <span style="flex-shrink:0">${(a.char_count||0).toLocaleString()}字</span>`;
    posPreview.appendChild(div);
  });
}

function execModalMove() {
  if (modalSrcEpIdx < 0) return;
  const dstEpIdx = parseInt(moveEpSelect.value);
  const insertPos = parseInt(movePosSelect.value);
  moveArticle(modalSrcEpIdx, modalSrcArtIdx, dstEpIdx, insertPos);
  closeMoveModal();
}

function truncate(str, max) {
  return str.length > max ? str.slice(0, max) + '…' : str;
}

/* ── Summary bar ── */
function updateSummary() {
  if (!planData) { summaryBar.innerHTML = ''; return; }
  const totalArt = planData.episodes.reduce((s, ep) => s + ep.articles.length, 0);
  const totalMin = planData.episodes.reduce((s, ep) => s + ep.estimated_minutes, 0).toFixed(1);
  const totalChars = planData.episodes.reduce((s, ep) =>
    s + ep.articles.reduce((ss, a) => ss + (a.char_count || 0), 0), 0);
  summaryBar.innerHTML = `
    <span class="stat">${planData.issue_date}</span>
    <span class="stat">${planData.episodes.length} EP</span>
    <span class="stat">${totalArt} 篇</span>
    <span class="stat">${totalChars.toLocaleString()} 字</span>
    <span class="stat">${totalMin} 分</span>`;
}

/* ── Keyboard ── */
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 's') {
    e.preventDefault();
    if (!saveBtn.disabled) saveBtn.click();
  }
  if (e.key === 'Escape') {
    if (moveModal.classList.contains('open')) closeMoveModal();
    if (imageModal.classList.contains('open')) closeImageModal();
  }
});

/* ── Image Modal ── */
const imageModal = document.getElementById('imageModal');
const imageModalImg = document.getElementById('imageModalImg');
const imageModalTitle = document.getElementById('imageModalTitle');
const imageModalRegenBtn = document.getElementById('imageModalRegenBtn');
const imageModalStatus = document.getElementById('imageModalStatus');
let currentImageArtId = null;

document.getElementById('imageModalCloseBtn').addEventListener('click', closeImageModal);
imageModal.addEventListener('click', e => { if (e.target === imageModal) closeImageModal(); });

function openImageModal(art) {
  currentImageArtId = art.id;
  const aidStr = String(art.id).padStart(3, '0');
  imageModalTitle.textContent = art.title_ja || '(no title)';
  imageModalImg.src = `/api/image/${aidStr}.png?t=${new Date().getTime()}`;
  imageModalStatus.textContent = '';
  imageModalRegenBtn.disabled = false;
  imageModal.classList.add('open');
}

function closeImageModal() {
  imageModal.classList.remove('open');
  currentImageArtId = null;
}

imageModalRegenBtn.addEventListener('click', async () => {
  if (!currentImageArtId) return;
  imageModalRegenBtn.disabled = true;
  imageModalStatus.textContent = '生成中... (約10〜20秒お待ちください)';
  imageModalStatus.style.color = 'var(--accent)';
  
  try {
    const resp = await fetch(`/api/image/regenerate/${currentImageArtId}`, { method: 'POST' });
    const data = await readJsonBody(resp);
    if (!resp.ok) throw new Error(data.error || `HTTP ${resp.status}`);
    
    imageModalStatus.textContent = '生成成功！';
    imageModalStatus.style.color = 'var(--success)';
    
    // Update image references to bypass cache
    const t = new Date().getTime();
    const aidStr = String(currentImageArtId).padStart(3, '0');
    imageModalImg.src = `/api/image/${aidStr}.png?t=${t}`;
    
    document.querySelectorAll(`.article-card[data-art-id="${currentImageArtId}"]`).forEach(card => {
      const thumb = card.querySelector('.card-thumb');
      const large = card.querySelector('.thumb-large');
      if (thumb) thumb.src = `/api/image/${aidStr}.png?t=${t}`;
      if (large) large.src = `/api/image/${aidStr}.png?t=${t}`;
    });
  } catch (e) {
    imageModalStatus.textContent = '生成失敗: ' + e.message;
    imageModalStatus.style.color = 'var(--danger)';
  } finally {
    imageModalRegenBtn.disabled = false;
  }
});

/* ── Prevent default file drop on window ── */
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => e.preventDefault());

/* ── Unsaved changes warning ── */
window.addEventListener('beforeunload', e => {
  if (isDirty) { e.preventDefault(); e.returnValue = ''; }
});

/* ── Init: auto-load ── */
autoLoad();
</script>
</body>
</html>
